<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c231a" />
      <stop offset="50%" stop-color="#164032" />
      <stop offset="100%" stop-color="#091812" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#43B339" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#43B339" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A" />
      <stop offset="50%" stop-color="#F29F05" />
      <stop offset="100%" stop-color="#C77800" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FBD38D" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bgGrad1)" />
  <rect width="800" height="533" fill="url(#glow1)" />

  <!-- Geometric Arch & Patterns -->
  <g opacity="0.12" stroke="#43B339" stroke-width="1.5" fill="none">
    <circle cx="400" cy="220" r="180" />
    <circle cx="400" cy="220" r="230" stroke-dasharray="6,6" />
    <polygon points="400,30 550,220 400,410 250,220" />
    <polygon points="400,10 590,220 400,430 210,220" stroke-dasharray="4,8" />
  </g>

  <!-- Islamic Arch Silhouette -->
  <path d="M260,380 V220 C260,140 400,80 400,80 C400,80 540,140 540,220 V380"
        fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" />

  <!-- Wedding Rings Symbol -->
  <g transform="translate(400, 205)" filter="url(#softGlow)">
    <!-- Ring 1 -->
    <ellipse cx="-28" cy="0" rx="46" ry="46" fill="none" stroke="url(#ringGrad)" stroke-width="9" opacity="0.9" />
    <!-- Ring 2 -->
    <ellipse cx="28" cy="0" rx="46" ry="46" fill="none" stroke="url(#goldGrad)" stroke-width="9" opacity="0.95" />
    <!-- Diamond Highlight -->
    <polygon points="28,-50 35,-42 28,-34 21,-42" fill="#FFFFFF" />
    <circle cx="28" cy="-42" r="3" fill="#FFFFFF" filter="url(#softGlow)" />
  </g>

  <!-- Floral Ornament Details -->
  <path d="M340,290 C370,270 385,280 400,295 C415,280 430,270 460,290"
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="400" cy="295" r="4" fill="#F29F05" />

  <!-- Badges & Title Plate -->
  <rect x="220" y="360" width="360" height="42" rx="21"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
  <text x="400" y="387" text-anchor="middle" fill="#FFFFFF"
        font-family="'Poppins', sans-serif" font-weight="700" font-size="16" letter-spacing="1">
    PELAYANAN AKAD NIKAH
  </text>

  <text x="400" y="430" text-anchor="middle" fill="#BDE8B7"
        font-family="'Inter', sans-serif" font-size="13" font-weight="500">
    Dokumentasi Prosesi Akad di Balai Nikah KUA Makale
  </text>
  <text x="400" y="455" text-anchor="middle" fill="#A2BFB6"
        font-family="'Inter', sans-serif" font-size="11" letter-spacing="2">
    RESMI • TERTIB • BERKAH
  </text>
</svg>
