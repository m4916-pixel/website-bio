<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18152e" />
      <stop offset="50%" stop-color="#1b2a38" />
      <stop offset="100%" stop-color="#0c101c" />
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="softGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="533" fill="url(#bgGrad4)" />
  <rect width="800" height="533" fill="url(#glow4)" />

  <!-- Harmonious Geometric Shapes -->
  <g opacity="0.12" stroke="#c084fc" stroke-width="1.5" fill="none">
    <circle cx="400" cy="210" r="160" />
    <circle cx="400" cy="210" r="210" stroke-dasharray="6,6" />
  </g>

  <!-- Family Harmony Heart & Shield Icon -->
  <g transform="translate(400, 205)" filter="url(#softGlow4)">
    <!-- Heart outline -->
    <path d="M0,45 C-70,0 -105,-45 -65,-80 C-35,-105 0,-70 0,-45 C0,-70 35,-105 65,-80 C105,-45 70,0 0,45 Z"
          fill="none" stroke="url(#purpleGold)" stroke-width="4.5" />

    <!-- Family Silhouette inside -->
    <!-- Father -->
    <circle cx="-25" cy="-28" r="9" fill="#FCD34D" />
    <path d="M-38,6 C-38,-10 -12,-10 -12,6" fill="none" stroke="#FCD34D" stroke-width="3.5" stroke-linecap="round" />
    <!-- Mother -->
    <circle cx="25" cy="-26" r="9" fill="#F472B6" />
    <path d="M12,6 C12,-10 38,-10 38,6" fill="none" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" />
    <!-- Child -->
    <circle cx="0" cy="-12" r="6.5" fill="#E9D5FF" />
    <path d="M-8,15 C-8,3 8,3 8,15" fill="none" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Dialogue / Consultation Spark -->
  <path d="M300,140 Q315,120 335,125" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M500,140 Q485,120 465,125" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Badge Plate -->
  <rect x="180" y="360" width="440" height="42" rx="21"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
  <text x="400" y="387" text-anchor="middle" fill="#FFFFFF"
        font-family="'Poppins', sans-serif" font-weight="700" font-size="16" letter-spacing="1">
    KONSULTASI &amp; MEDIASI BP4
  </text>

  <text x="400" y="430" text-anchor="middle" fill="#E9D5FF"
        font-family="'Inter', sans-serif" font-size="13" font-weight="500">
    Layanan Konseling &amp; Penasihatan Ketahanan Keluarga
  </text>
  <text x="400" y="455" text-anchor="middle" fill="#A8A29E"
        font-family="'Inter', sans-serif" font-size="11" letter-spacing="2">
    RUKUN • AMANAH • SOLUTIF
  </text>
</svg>
