<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14241b" />
      <stop offset="50%" stop-color="#1d432b" />
      <stop offset="100%" stop-color="#0a1811" />
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="greenSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="softGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="533" fill="url(#bgGrad5)" />
  <rect width="800" height="533" fill="url(#glow5)" />

  <!-- Radiating Sunbeams / Rays -->
  <g opacity="0.12" stroke="#86efac" stroke-width="1.5">
    <line x1="400" y1="200" x2="250" y2="80" />
    <line x1="400" y1="200" x2="330" y2="60" />
    <line x1="400" y1="200" x2="400" y2="50" />
    <line x1="400" y1="200" x2="470" y2="60" />
    <line x1="400" y1="200" x2="550" y2="80" />
    <circle cx="400" cy="200" r="160" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Community Gathering & Torch / Voice Emblem -->
  <g transform="translate(400, 205)" filter="url(#softGlow5)">
    <!-- Torch / Guidance Flame -->
    <path d="M0,-85 C18,-55 24,-35 0,-10 C-24,-35 -18,-55 0,-85 Z" fill="url(#greenSun)" />
    <circle cx="0" cy="-45" r="7" fill="#FEF08A" />

    <!-- Speaker Podium / Community Figures in circle -->
    <circle cx="-55" cy="15" r="11" fill="#86EFAC" opacity="0.85" />
    <path d="M-72,50 C-72,32 -38,32 -38,50" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" />

    <circle cx="0" cy="5" r="13" fill="#FFFFFF" />
    <path d="M-20,45 C-20,24 20,24 20,45" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <circle cx="55" cy="15" r="11" fill="#86EFAC" opacity="0.85" />
    <path d="M38,50 C38,32 72,32 72,50" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Badge Plate -->
  <rect x="170" y="360" width="460" height="42" rx="21"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
  <text x="400" y="387" text-anchor="middle" fill="#FFFFFF"
        font-family="'Poppins', sans-serif" font-weight="700" font-size="16" letter-spacing="1">
    PENYULUHAN &amp; MODERASI BERAGAMA
  </text>

  <text x="400" y="430" text-anchor="middle" fill="#BBF7D0"
        font-family="'Inter', sans-serif" font-size="13" font-weight="500">
    Pembinaan Umat &amp; Penguatan Kerukunan Beragama di Tana Toraja
  </text>
  <text x="400" y="455" text-anchor="middle" fill="#A7F3D0"
        font-family="'Inter', sans-serif" font-size="11" letter-spacing="2">
    HARMONI • EDUKASI • TOLERANSI
  </text>
</svg>
